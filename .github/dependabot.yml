version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: monthly
      groups:
          composer-development-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      groups:
          npm-development-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          github-actions:
              patterns:
                  - '*'
