name: WordPress integration tests

on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

jobs:
    integration:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.experimental }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: WordPress 6.9 latest patch with PHP 8.4
                      wordpress: '6.9'
                      php: '8.4'
                      experimental: false
                    - name: Latest WordPress with PHP 8.4
                      wordpress: latest
                      php: '8.4'
                      experimental: false
                    - name: Latest WordPress with PHP 8.5
                      wordpress: latest
                      php: '8.5'
                      experimental: false
                    - name: WordPress trunk with PHP 8.5
                      wordpress: trunk
                      php: '8.5'
                      experimental: true

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: |
                  composer install --no-interaction --prefer-dist
                  npm ci

            - name: Resolve the WordPress source
              env:
                  WORDPRESS_LINE: ${{ matrix.wordpress }}
              run: |
                  if [[ "${WORDPRESS_LINE}" == "6.9" ]]; then
                    download_url="$(
                      curl --fail --silent --show-error \
                        'https://api.wordpress.org/core/version-check/1.7/?version=6.9&php=8.4&locale=en_US' |
                        jq --raw-output '
                          .offers
                          | map(select(.version | test("^6\\.9\\.[0-9]+$")))
                          | max_by(.version | split(".") | map(tonumber))
                          | .download
                        '
                    )"
                    test -n "${download_url}"
                    echo "WP_ENV_CORE=${download_url}" >> "${GITHUB_ENV}"
                  elif [[ "${WORDPRESS_LINE}" == "trunk" ]]; then
                    echo "WP_ENV_CORE=WordPress/WordPress#master" >> "${GITHUB_ENV}"
                  fi

            - name: Run WordPress integration tests
              env:
                  WP_ENV_PHP_VERSION: ${{ matrix.php }}
              run: npm run test:integration:ci
