name: Production artifact

on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

jobs:
    artifact:
        name: Build and verify the production ZIP
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: |
                  composer install --no-interaction --prefer-dist
                  npm ci

            - name: Build and inspect reproducible ZIP bytes
              run: npm run artifact:reproducible

            - name: Resolve the latest WordPress 6.9 patch
              run: |
                  echo "WP_ENV_CORE=$(bash tools/resolve-wordpress-core.sh)" >> "${GITHUB_ENV}"

            - name: Exercise the ZIP lifecycle and run Plugin Check
              env:
                  WP_ENV_PHP_VERSION: '8.4'
              run: npm run artifact:test

            - name: Check release inputs and artifact for secret-like content
              run: npm run secret:check

            - name: Upload the verified artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: charter-${{ github.sha }}
                  path: |
                      build/charter.zip
                      build/charter.zip.sha256
                  if-no-files-found: error
