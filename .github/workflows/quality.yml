name: Quality

on:
    push:
    pull_request:
    workflow_dispatch:

permissions: {}

jobs:
    php-quality:
        name: PHP quality
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer

            - name: Validate Composer metadata
              run: composer validate --strict

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Audit PHP dependencies
              run: composer audit --locked

            - name: Check PHP syntax
              run: find charter.php uninstall.php src tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: Run PHPCS
              run: composer lint

            - name: Run PHPStan
              run: composer analyse

    unit-tests:
        name: Unit tests on PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.4'
                    - '8.5'

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist

            - name: Run pure unit tests
              run: composer test

    repository-format:
        name: Repository format
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci

            - name: Audit Node.js dependencies
              run: npm run audit

            - name: Check repository formatting
              run: npm run format:check

            - name: Run browser behavior tests
              run: npm run test:javascript
