name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Bare semantic version matching an existing Git tag
                required: true
                type: string
            publish_github:
                description: Publish or update the GitHub Release after verification
                required: true
                default: true
                type: boolean
            deploy_wordpress_org:
                description: Run the separately gated WordPress.org deployment
                required: true
                default: false
                type: boolean
            wordpress_org_dry_run:
                description: Validate WordPress.org deployment without committing to SVN
                required: true
                default: true
                type: boolean

permissions: {}

jobs:
    verify:
        name: Verify release ${{ inputs.version }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            commit_sha: ${{ steps.release_metadata.outputs.commit_sha }}

        steps:
            - name: Validate the release version
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Release tags must be bare semantic versions." >&2
                    exit 1
                  fi

            - name: Check out the release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.version }}
                  persist-credentials: false

            - name: Validate the tag and release notes
              id: release_metadata
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  actual_tag="$(git describe --tags --exact-match)"
                  test "${actual_tag}" = "${RELEASE_VERSION}"
                  test -f ".github/release-notes/${RELEASE_VERSION}.md"
                  echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
                  echo "EXPECTED_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: |
                  composer install --no-interaction --prefer-dist
                  npm ci

            - name: Run quality checks
              run: |
                  composer check
                  npm run format:check
                  npm run test:javascript
                  npm run audit

            - name: Resolve the latest WordPress 6.9 patch
              run: |
                  echo "WP_ENV_CORE=$(bash tools/resolve-wordpress-core.sh)" >> "${GITHUB_ENV}"

            - name: Run WordPress integration tests
              env:
                  WP_ENV_PHP_VERSION: '8.4'
              run: npm run test:integration:ci

            - name: Run complete OAuth behavior matrix
              env:
                  WP_ENV_PHP_VERSION: '8.4'
              run: |
                  npm run test:oauth:http:ci
                  npm run test:network-admin:http:ci
                  npm run test:slice0:multisite:ci
                  npm run test:slice0:rest-auth:ci
                  npm run test:slice0:discovery-publication:ci
                  npm run test:slice0:atomic:matrix
                  npm run test:slice0:cimd-outbound-safety:ci

            - name: Resolve the latest WordPress 7.1 patch
              run: |
                  echo "WP_ENV_CORE=$(WORDPRESS_BRANCH=7.1 bash tools/resolve-wordpress-core.sh)" >> "${GITHUB_ENV}"

            - name: Verify current WordPress compatibility
              env:
                  WP_ENV_PHP_VERSION: '8.4'
              run: npm run test:integration:ci

            - name: Build and inspect reproducible ZIP bytes
              run: npm run artifact:reproducible

            - name: Exercise the ZIP lifecycle and run Plugin Check
              env:
                  WP_ENV_PHP_VERSION: '8.4'
              run: npm run artifact:test

            - name: Check release inputs and artifact for secret-like content
              run: npm run secret:check

            - name: Save the verified release files
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: charter-release-${{ inputs.version }}
                  path: |
                      build/charter.zip
                      build/charter.zip.sha256
                  if-no-files-found: error
                  retention-days: 1

    publish_github:
        name: Publish GitHub release ${{ inputs.version }}
        if: ${{ inputs.publish_github }}
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Check out the release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.verify.outputs.commit_sha }}
                  persist-credentials: false

            - name: Download the verified release files
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: charter-release-${{ inputs.version }}
                  path: build

            - name: Verify and extract the transferred ZIP
              run: |
                  cd build
                  sha256sum --check charter.zip.sha256
                  mkdir -p extracted
                  unzip -q charter.zip -d extracted

            - name: Revalidate the release tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  VERIFIED_COMMIT: ${{ needs.verify.outputs.commit_sha }}
              run: |
                  test "$(git rev-parse HEAD)" = "${VERIFIED_COMMIT}"
                  current_tag_commit="$(
                    gh api \
                      "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_VERSION}" \
                      --jq '.sha'
                  )"
                  test "${current_tag_commit}" = "${VERIFIED_COMMIT}"

            - name: Publish the verified GitHub Release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: ${{ inputs.version }}
                  name: Charter ${{ inputs.version }}
                  body_path: .github/release-notes/${{ inputs.version }}.md
                  files: |
                      build/charter.zip
                      build/charter.zip.sha256
                  fail_on_unmatched_files: true

    wordpress_org:
        name: Deploy WordPress.org release ${{ inputs.version }}
        if: ${{ inputs.deploy_wordpress_org }}
        needs: verify
        runs-on: ubuntu-latest
        environment: wordpress.org
        permissions:
            contents: read

        steps:
            - name: Check out the release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.verify.outputs.commit_sha }}
                  persist-credentials: false

            - name: Download the verified release files
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: charter-release-${{ inputs.version }}
                  path: build

            - name: Verify and extract the transferred ZIP
              run: |
                  cd build
                  sha256sum --check charter.zip.sha256
                  mkdir -p extracted
                  unzip -q charter.zip -d extracted

            - name: Revalidate the release tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  VERIFIED_COMMIT: ${{ needs.verify.outputs.commit_sha }}
              run: |
                  test "$(git rev-parse HEAD)" = "${VERIFIED_COMMIT}"
                  current_tag_commit="$(
                    gh api \
                      "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_VERSION}" \
                      --jq '.sha'
                  )"
                  test "${current_tag_commit}" = "${VERIFIED_COMMIT}"

            - name: Remove the assets placeholder
              run: rm -f .wordpress-org/.gitkeep

            - name: Deploy the verified directory to WordPress.org
              uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: charter
                  VERSION: ${{ inputs.version }}
                  BUILD_DIR: ${{ github.workspace }}/build/extracted/charter
              with:
                  dry-run: ${{ inputs.wordpress_org_dry_run }}
                  generate-zip: false
