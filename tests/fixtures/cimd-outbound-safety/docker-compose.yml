  http-proxy:
    <<: *p3-service
    command: ["php", "/fixture/proxy/server.php", "http"]
    environment:
      P3_CA_FILE: /certs/ca.crt
      P3_LISTEN: "0.0.0.0:8080"
      P3_STATE_DIR: /state
    volumes:
