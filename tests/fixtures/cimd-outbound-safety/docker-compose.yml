name: charter-p3-cimd-outbound-safety

x-p3-service: &p3-service
  # Multi-arch manifest verified 2026-08-05; linux/arm64 child:
  # sha256:d848c4b7de2fa4f22dc22761fe447ccd194977e509d9760eb8537c020531b365.
  image: wordpress:php8.4-apache@sha256:3f1b6098b3c2dae13f20a0a36e02225e56edfe73643ca2555c5a079de7d1ca41
  init: true
  read_only: true
  restart: "no"
  user: "33:33"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777
  networks:
    hostile:

x-p3-fixture-volumes: &p3-fixture-volumes
  - .:/fixture:ro
  - ${P3_STATE_DIR:?P3_STATE_DIR is required}:/state

services:
  dns:
    <<: *p3-service
    user: "0:0"
    command: ["php", "/fixture/dns/server.php"]
    environment:
      P3_DNS_LISTEN: "0.0.0.0:53"
      P3_STATE_DIR: /state
    cap_add:
      - NET_BIND_SERVICE
    volumes: *p3-fixture-volumes
    networks:
      hostile:
        ipv4_address: 198.17.0.53

  origin:
    <<: *p3-service
    user: "0:0"
    command: ["php", "/fixture/origin/server.php", "origin"]
    environment:
      P3_CERT_DIR: /certs
      P3_LISTEN: "0.0.0.0:443"
      P3_STATE_DIR: /state
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - .:/fixture:ro
      - ${P3_STATE_DIR:?P3_STATE_DIR is required}:/state
      - ${P3_CERT_DIR:?P3_CERT_DIR is required}/server.crt:/certs/server.crt:ro
      - ${P3_CERT_DIR:?P3_CERT_DIR is required}/server.key:/certs/server.key:ro
