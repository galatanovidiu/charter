global

defaults
	mode tcp
	timeout connect 3s
	timeout client 10s
	timeout server 10s

frontend apache_tls
	bind *:8443
	default_backend apache_backend

backend apache_backend
	server apache apache:443 check init-addr libc,none

frontend nginx_tls
	bind *:8444
	default_backend nginx_backend

backend nginx_backend
	server nginx nginx:443 check init-addr libc,none

frontend proxy_tls
	bind *:8445
	default_backend proxy_backend

backend proxy_backend
	server proxy proxy:443 check init-addr libc,none

frontend dot_deny_tls
	bind *:8446
	default_backend dot_deny_backend

backend dot_deny_backend
	server dot-deny dot-deny:443 check init-addr libc,none

frontend physical_well_known_tls
	bind *:8447
	default_backend physical_well_known_backend

backend physical_well_known_backend
	server physical-well-known physical-well-known:443 check init-addr libc,none

frontend intercept_redirect_tls
	bind *:8448
	default_backend intercept_redirect_backend

backend intercept_redirect_backend
	server intercept-redirect intercept-redirect:443 check init-addr libc,none

frontend intercept_json_tls
	bind *:8449
	default_backend intercept_json_backend

backend intercept_json_backend
	server intercept-json intercept-json:443 check init-addr libc,none

frontend html_fallback_tls
	bind *:8450
	default_backend html_fallback_backend

backend html_fallback_backend
	server html-fallback html-fallback:443 check init-addr libc,none
