global
	log stdout format raw local0

defaults
	log global
	mode http
	timeout connect 3s
	timeout client 10s
	timeout server 10s

frontend charter_https
	bind *:443 ssl crt /certs/server.crt
	default_backend wordpress_origin

backend wordpress_origin
	server origin proxy-origin:443 ssl verify required ca-file /certs/ca.crt verifyhost issuer.charter.test sni str(issuer.charter.test) check
