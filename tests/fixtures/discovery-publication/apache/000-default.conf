<VirtualHost *:80>
	ServerName issuer.charter.test
	<Location />
		Require all denied
	</Location>
</VirtualHost>

<VirtualHost *:443>
	ServerName issuer.charter.test
	DocumentRoot /var/www/html
	SSLEngine on
	SSLCertificateFile /certs/server.crt
	SSLCertificateKeyFile /certs/server.crt.key
	<Directory /var/www/html>
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
